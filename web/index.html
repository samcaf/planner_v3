<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planner</title>

    <!-- All generated by scripts/build-brand.sh from assets/brand.

         Two tab icons, picked by the browser's own colour scheme, both using
         the sidebar's pairing so the tab and the mark at the foot of the rail
         are the same object. A single icon cannot do this: parchment punches a
         pale square into a dark toolbar, and the ink disappears into a light
         one. The plain favicon.ico last is the fallback for anything that
         ignores the media attribute. -->
    <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)"
          href="/brand/favicon-dark.png" sizes="64x64" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: light)"
          href="/brand/favicon-light.png" sizes="64x64" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Added to a phone's home screen this opens without browser chrome, and
         the status bar picks up the sidebar's colour rather than white. -->
    <meta name="theme-color" content="#241a33" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
