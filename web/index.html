<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planner</title>

    <!-- All generated by scripts/build-brand.sh from assets/brand.

         Two tab icons picked by the browser's own colour scheme, both the same
         artwork as the mark at the foot of the sidebar. A single icon cannot
         serve both: parchment punches a pale square into a dark toolbar, and
         the ink disappears into a light one.

         The ?v= is not decoration. Browsers cache favicons far more stubbornly
         than pages — a hard refresh usually will not shift one — so the only
         reliable way to publish a new mark is to change its URL. Bump this when
         the artwork changes.

         The .ico deliberately carries NO sizes="any": with it, Chrome treats
         the .ico as the best match at every size and never consults the two
         media-qualified PNGs above, so the tab keeps the light icon on a dark
         toolbar. Without it, the PNGs win and this stays a fallback for
         browsers that ignore `media` altogether. -->
    <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)"
          href="/brand/favicon-dark.png?v=3" sizes="64x64" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: light)"
          href="/brand/favicon-light.png?v=3" sizes="64x64" />
    <link rel="icon" href="/brand/favicon.ico?v=3" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Added to a phone's home screen this opens without browser chrome, and
         the status bar picks up the sidebar's colour rather than white. -->
    <meta name="theme-color" content="#241a33" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
